<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser not supported · Service1 UI</title>
<style>body{font:14px Inter,system-ui,sans-serif;background:#0A2540;color:#fff;display:grid;place-items:center;height:100vh;margin:0}
.err{max-width:520px;text-align:center;padding:0 20px}
.err h1{font-size:22px;margin:0 0 12px}
.err p{font-size:13px;opacity:.8;line-height:1.6;margin:6px 0}</style>
</head>
<body>
  <div class="err">
    <h1>Your browser is not supported</h1>
    <p>Service1 UI uses the Trusted Types web platform feature to prevent XSS attacks.
       Your browser does not support Trusted Types, so we cannot safely load the app.</p>
    <p>Please use a recent version of <b>Chrome</b>, <b>Edge</b>, or another Chromium-based browser.</p>
  </div>
</body></html>
